<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Map - Kamionová navigace</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #1a1d21; color: #fff; }
        #sidebar { width: 360px; background: #0f172a; padding: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 1000; overflow-y: auto; border-right: 1px solid #1e293b; }
        #map { flex: 1; height: 100%; }
        h2 { margin: 0 0 2px 0; font-size: 20px; font-weight: 700; color: #fff; }
        .subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #38bdf8; letter-spacing: 0.5px; }
        input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 13px; margin-top: 4px; }
        input:focus { outline: none; border-color: #38bdf8; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Truck Navigator</h2>
    <div class="subtitle">& Zákazy jízdy v Německu (Ferienreise)</div>

    <div>
        <label>START (ŠÍŘKA, DÉLKA)</label>
        <input type="text" id="startCoords" placeholder="50.0755, 14.4378" value="50.0755, 14.4378" />
    </div>

    <div>
        <label>CÍL (ŠÍŘKA, DÉLKA)</label>
        <input type="text" id="endCoords" placeholder="53.5511, 9.9937" value="53.5511, 9.9937" />
    </div>

    <div class="row">
        <div>
            <label>VÝŠKA (M)</label>
            <input type="number" id="height" value="4.0" step="0.1" />
        </div>
        <div>
            <label>DÉLKA (M)</label>
            <input type="number" id="length" value="16.5" step="0.1" />
        </div>
    </div>

    <button onclick="calculateRoute()">Spočítat přímou trasu (HGV)</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([51.1657, 10.4515], 6);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19
    }).addTo(map);

    // Definice dálničních zákazových tras
    const germanBans = [
        { name: "A1 Zákaz jízdy", coords: [[53.86, 10.68], [53.55, 9.99], [53.07, 8.80], [51.51, 7.46], [50.93, 6.95]] },
        { name: "A2 Zákaz jízdy", coords: [[52.37, 9.73], [52.26, 10.52]] },
        { name: "A3 Zákaz jízdy", coords: [[51.47, 6.85], [50.11, 8.68], [49.79, 9.93], [49.45, 11.08], [48.56, 13.46]] },
        { name: "A5 Zákaz jízdy", coords: [[50.80, 9.54], [50.11, 8.68], [49.00, 8.40], [47.55, 7.58]] },
        { name: "A6 Zákaz jízdy", coords: [[49.48, 8.46], [49.14, 9.21], [49.45, 11.08]] },
        { name: "A7 Zákaz jízdy", coords: [[53.55, 9.99], [52.37, 9.73], [51.31, 9.49], [49.79, 9.93], [47.56, 10.70]] },
        { name: "A8 Zákaz jízdy", coords: [[49.00, 8.40], [48.77, 9.18], [48.13, 11.57], [47.80, 12.00]] },
        { name: "A9 Zákaz jízdy", coords: [[51.34, 12.37], [49.45, 11.08], [48.13, 11.57]] },
        { name: "A61 Zákaz jízdy", coords: [[50.35, 7.59], [49.53, 8.35]] },
        { name: "A99 Mnichov", coords: [[48.22, 11.45], [48.11, 11.73]] }
    ];

    // Funkce, která automaticky stáhne přesné zakřivení dálnic
    async function loadAccurateBans() {
        for (const ban of germanBans) {
            const coordsFormatted = ban.coords.map(c => `${c[1]},${c[0]}`).join(';');
            const url = `https://router.project-osrm.org/route/v1/driving/${coordsFormatted}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.routes && data.routes[0]) {
                    L.geoJSON(data.routes[0].geometry, {
                        style: { color: '#ef4444', weight: 5, dashArray: '8, 8', opacity: 0.95 }
                    }).addTo(map).bindPopup(`<b>${ban.name}</b><br>Sobotní zákaz jízdy (07:00 – 20:00)`);
                }
            } catch (e) {
                console.error("Chyba při načítání zákazu:", e);
            }
        }
    }

    // Načíst přesné dálnice při otevření stránky
    loadAccurateBans();

    let routeLayer;

    async function calculateRoute() {
        const startInput = document.getElementById('startCoords').value.split(',');
        const endInput = document.getElementById('endCoords').value.split(',');

        if (startInput.length !== 2 || endInput.length !== 2) {
            alert('Zadejte souřadnice ve tvaru: Šířka, Délka');
            return;
        }

        const startLat = parseFloat(startInput[0].trim());
        const startLng = parseFloat(startInput[1].trim());
        const endLat = parseFloat(endInput[0].trim());
        const endLng = parseFloat(endInput[1].trim());

        const url = `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${endLng},${endLat}?overview=full&geometries=geojson`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Chyba serveru (${response.status})`);

            const data = await response.json();
            if (!data.routes || data.routes.length === 0) {
                alert('Trasa nebyla nalezena.');
                return;
            }

            if (routeLayer) map.removeLayer(routeLayer);

            routeLayer = L.geoJSON(data.routes[0].geometry, {
                style: { color: '#0284c7', weight: 6, opacity: 0.9 }
            }).addTo(map);

            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

        } catch (error) {
            console.error('Chyba při výpočtu:', error);
            alert('Chyba výpočtu trasy: ' + error.message);
        }
    }
</script>

</body>
</html>
