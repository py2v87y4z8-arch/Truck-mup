<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKW Plánovač BGL 2026</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 700px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 12px; }
        label { font-weight: bold; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #0056b3; color: white; border: none; padding: 10px 15px; width: 100%; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f8f9fa; }
        .status-ok { color: green; font-weight: bold; }
        .status-warn { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📋 Plánovač přeprav BGL 2026</h2>
        <div class="form-group">
            <label>Trasa / Průjezdní body (oddělené čárkou, např. A45, B26, A73):</label>
            <input type="text" id="route" value="A45, B26, A73, ELBTUNNEL">
        </div>
        <div class="form-group">
            <label>Hmotnost (tuny):</label>
            <input type="number" id="weight" value="12.0" step="0.1">
        </div>
        <div class="form-group">
            <label>Výška (metry):</label>
            <input type="number" id="height" value="4.0" step="0.1">
        </div>
        <div class="form-group">
            <label>Přeprava ADR (nebezpečný náklad):</label>
            <select id="hazmat">
                <option value="false">Ne</option>
                <option value="true">Ano</option>
            </select>
        </div>
        <button onclick="evaluateRoute()">Vyhodnotit plán trasy</button>
        <div id="results"></div>
    </div>

    <script>
        const RESTRICTIONS = {
            "A45": { name: "A45 Talbrücke Rahmede", closed: true, detour: "Objížďka přes A1/A3" },
            "A73": { name: "A73 Norimberk", max_h: 3.9, detour: "A9 pro vozidla nad 3.9 m" },
            "B26": { name: "B26 Hösbach", max_w: 7.5, detour: "A3 Hösbach/Aschaffenburg" },
            "ELBTUNNEL": { name: "Elbtunnel (A7)", adr: true, time: "05:00-23:00", detour: "Objízdný okruh A21/B205" }
        };

        function evaluateRoute() {
            const nodes = document.getElementById("route").value.split(",").map(s => s.trim().toUpperCase());
            const weight = parseFloat(document.getElementById("weight").value);
            const height = parseFloat(document.getElementById("height").value);
            const hazmat = document.getElementById("hazmat").value === "true";

            let overallStatus = true;
            let rowsHtml = "";

            nodes.forEach(node => {
                if (RESTRICTIONS[node]) {
                    const res = RESTRICTIONS[node];
                    let issues = [];

                    if (res.closed) issues.push("Úplná uzávěra");
                    if (res.max_w && weight > res.max_w) issues.push(`Váha ${weight}t > ${res.max_w}t`);
                    if (res.max_h && height > res.max_h) issues.push(`Výška ${height}m > ${res.max_h}m`);
                    if (res.adr && hazmat) issues.push(`Zákaz ADR (${res.time || 'Trvalé'})`);

                    if (issues.length > 0) {
                        overallStatus = false;
                        rowsHtml += `<tr><td>${res.name}</td><td><span class="status-warn">ZÁKAZ: ${issues.join(", ")}</span></td><td>${res.detour}</td></tr>`;
                    } else {
                        rowsHtml += `<tr><td>${res.name}</td><td><span class="status-ok">OK</span></td><td>-</td></tr>`;
                    }
                } else {
                    rowsHtml += `<tr><td>${node}</td><td><span class="status-ok">OK (Bez omezení)</span></td><td>-</td></tr>`;
                }
            });

            const statusHeader = overallStatus 
                ? `<h3 class="status-ok">Výsledek: SCHVÁLENO</h3>` 
                : `<h3 class="status-warn">Výsledek: VYŽADUJE ÚPRAVU TRASY</h3>`;

            document.getElementById("results").innerHTML = statusHeader + 
                `<table><tr><th>Úsek</th><th>Stav</th><th>Doporučená objížďka</th></tr>${rowsHtml}</table>`;
        }
    </script>
</body>
</html>
