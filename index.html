<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Map - Kamionová navigace</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 320px; background: #1e293b; color: white; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        #map { flex: 1; height: 100%; }
        input, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { background: #0284c7; cursor: pointer; font-weight: bold; border: none; margin-top: 10px; }
        button:hover { background: #0369a1; }
        .label { font-size: 12px; color: #94a3b8; margin-bottom: -5px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Truck Navigation</h2>
    
    <div class="label">API Klíč (HeiGIT / OpenRouteService)</div>
    <input type="text" id="apiKey" placeholder="Vložte váš API klíč (ey...)" />

    <div class="label">Start (Zeměpisná šířka, délka)</div>
    <input type="text" id="startCoords" placeholder="např. 50.0755, 14.4378" value="50.0755, 14.4378" />

    <div class="label">Cíl (Zeměpisná šířka, délka)</div>
    <input type="text" id="endCoords" placeholder="např. 52.5200, 13.4050" value="52.5200, 13.4050" />

    <button onclick="calculateRoute()">Spočítat trasu pro kamion</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Inicializace mapy
    const map = L.map('map').setView([51.1657, 10.4515], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let routeLayer;

    async function calculateRoute() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const startInput = document.getElementById('startCoords').value.split(',');
        const endInput = document.getElementById('endCoords').value.split(',');

        if (!apiKey) {
            alert('Prosím vložte váš API klíč!');
            return;
        }

        if (startInput.length !== 2 || endInput.length !== 2) {
            alert('Zadejte souřadnice ve tvaru: Šířka, Délka');
            return;
        }

        const startLat = parseFloat(startInput[0].trim());
        const startLng = parseFloat(startInput[1].trim());
        const endLat = parseFloat(endInput[0].trim());
        const endLng = parseFloat(endInput[1].trim());

        // NOVÁ AKTUALIZOVANÁ ADRESA HEIGIT (Nahradila starou api.openrouteservice.org)
        const url = 'https://api.heigit.org/v2/directions/driving-hgv/geojson';

        const bodyData = {
            coordinates: [
                [startLng, startLat], // ORS vyžaduje pořadí [Délka, Šířka]
                [endLng, endLat]
            ]
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': apiKey,
                    'Content-Type': 'application/json',
                    'Accept': 'application/json, application/geo+json'
                },
                body: JSON.stringify(bodyData)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `Chyba serveru: ${response.status}`);
            }

            const data = await response.json();

            // Odstranění staré trasy z mapy
            if (routeLayer) {
                map.removeLayer(routeLayer);
            }

            // Vykreslení nové trasy
            routeLayer = L.geoJSON(data, {
                style: { color: '#0284c7', weight: 6, opacity: 0.8 }
            }).addTo(map);

            // Přizpůsobení pohledu mapy na trasu
            map.fitBounds(routeLayer.getBounds());

        } catch (error) {
            console.error('Chyba při výpočtu trasy:', error);
            alert('Chyba výpočtu trasy: ' + error.message);
        }
    }
</script>

</body>
</html>
