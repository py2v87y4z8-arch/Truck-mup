<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LKW Navigace & Plánovač Trasy BGL</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #121212; color: #fff; }
        
        #app-header { background: #1e1e1e; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
        #app-header h1 { margin: 0; font-size: 18px; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
        
        /* Layout s panelem na boku/nahoře a mapou */
        .main-layout { display: flex; flex-direction: column; height: calc(100vh - 50px); }
        @media (min-width: 768px) {
            .main-layout { flex-direction: row; }
        }

        /* Formulář plánovače */
        #route-panel { background: #181818; padding: 16px; width: 100%; max-width: 380px; border-right: 1px solid #333; overflow-y: auto; }
        .panel-title { font-size: 16px; font-weight: bold; color: #f59e0b; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; background: #262626; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #f59e0b; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 8px; background: #262626; padding: 10px; border-radius: 6px; border: 1px solid #444; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: #f59e0b; }
        .checkbox-group label { margin: 0; font-size: 13px; color: #fff; cursor: pointer; }

        .btn-calc { width: 100%; background: #f59e0b; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-calc:hover { background: #d97706; }

        /* Mapa */
        #map { flex: 1; height: 100%; min-height: 400px; background: #242424; }

        /* Vyskakovací okno */
        .leaflet-popup-content-wrapper { background: #1e1e1e; color: #fff; border: 1px solid #444; border-radius: 8px; }
        .leaflet-popup-tip { background: #1e1e1e; }
        .popup-title { font-weight: bold; color: #f59e0b; margin-bottom: 4px; }
        .popup-detour { background: #064e3b; color: #a7f3d0; padding: 6px; border-radius: 4px; margin-top: 6px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="app-header">
        <h1>🚛 LKW Plánovač & Navigace BGL 2026</h1>
    </div>

    <div class="main-layout">
        <!-- Boční panel pro trasu a parametry vozidla -->
        <div id="route-panel">
            <div class="panel-title">📍 Plánování Trasy</div>
            
            <div class="form-group">
                <label>ODKUD (Město / Adresa)</label>
                <input type="text" id="startInput" class="form-control" placeholder="např. Praha" value="Praha">
            </div>

            <div class="form-group">
                <label>KAM (Město / Adresa)</label>
                <input type="text" id="endInput" class="form-control" placeholder="např. Hamburg" value="Hamburg">
            </div>

            <div class="panel-title" style="margin-top: 20px;">🚛 Parametry Vozidla (LKW)</div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Váha (Tuny)</label>
                    <input type="number" id="weightInput" class="form-control" value="40" step="0.5">
                </div>
                <div class="form-group">
                    <label>Výška (Metry)</label>
                    <input type="number" id="heightInput" class="form-control" value="4.0" step="0.1">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Délka (Metry)</label>
                    <input type="number" id="lengthInput" class="form-control" value="16.5" step="0.5">
                </div>
                <div class="form-group">
                    <label>Šířka (Metry)</label>
                    <input type="number" id="widthInput" class="form-control" value="2.55" step="0.05">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="adrInput">
                <label for="adrInput">⚠️ Přeprava ADR (Nebezpečný náklad)</label>
            </div>

            <button class="btn-calc" onclick="calculateRoute()">🔍 Spočítat a Zkontrolovat Trasu</button>

            <div id="route-info" style="margin-top: 15px; font-size: 13px; color: #aaa;"></div>
        </div>

        <!-- Mapa -->
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([51.1657, 10.4515], 6);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Databáze BGL omezení
        const BGL_RESTRICTIONS = [
            { name: "A45 - Talbrücke Rahmede", coords: [51.2222, 7.6311], type: "CLOSED", detail: "Úplná uzávěra mostu.", detour: "Objížďka přes A1 / A3." },
            { name: "A7 - Elbtunnel", coords: [53.5435, 9.9073], type: "ADR", detail: "Zákaz ADR (05:00 - 23:00).", detour: "Objížďka přes A21 / B205." },
            { name: "A73 - Norimberk", coords: [49.4521, 11.0767], type: "HEIGHT", maxH: 3.9, detail: "Výškové omezení podjezdu 3.9m.", detour: "Objezd přes A9." },
            { name: "B26 - Hösbach", coords: [50.0036, 9.2053], type: "WEIGHT", maxW: 7.5, detail: "Zákaz nad 7.5t.", detour: "Objížďka přes A3." }
        ];

        let routeLayer = null;
        let markersGroup = L.layerGroup().addTo(map);

        // Vykreslit body zákazu na mapě
        function drawBGLPoints() {
            BGL_RESTRICTIONS.forEach(item => {
                let color = "#ef4444";
                if (item.type === "WEIGHT" || item.type === "HEIGHT") color = "#f59e0b";
                if (item.type === "ADR") color = "#3b82f6";

                const customIcon = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color: ${color}; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>`,
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                const marker = L.marker(item.coords, { icon: customIcon }).addTo(markersGroup);
                marker.bindPopup(`
                    <div class="popup-title">${item.name}</div>
                    <div>${item.detail}</div>
                    <div class="popup-detour"><b>Objížďka BGL:</b> ${item.detour}</div>
                `);
            });
        }

        // Vyhledání GPS souřadnic podle názvu města
        async function geocode(city) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`);
            const data = await res.json();
            if (data && data.length > 0) {
                return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
            }
            return null;
        }

        // Výpočet trasy s ohledem na parametry kamionu
        async function calculateRoute() {
            const startCity = document.getElementById('startInput').value;
            const endCity = document.getElementById('endInput').value;
            const weight = parseFloat(document.getElementById('weightInput').value);
            const height = parseFloat(document.getElementById('heightInput').value);
            const isAdr = document.getElementById('adrInput').checked;
            const routeInfo = document.getElementById('route-info');

            routeInfo.innerHTML = "🔄 Vyhledávám tranzitní trasu...";

            const startCoords = await geocode(startCity);
            const endCoords = await geocode(endCity);

            if (!startCoords || !endCoords) {
                routeInfo.innerHTML = "❌ Nepodařilo se najít zadaná města. Zkontrolujte název.";
                return;
            }

            // Načtení trasy přes OSRM routing
            const url = `https://router.project-osrm.org/route/v1/driving/${startCoords[1]},${startCoords[0]};${endCoords[1]},${endCoords[0]}?overview=full&geometries=geojson`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

                    if (routeLayer) map.removeLayer(routeLayer);

                    // Vykreslení naplánované trasy
                    routeLayer = L.polyline(coords, { color: '#3b82f6', weight: 6, opacity: 0.8 }).addTo(map);
                    map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

                    const distanceKm = (route.distance / 1000).toFixed(0);
                    const hours = Math.floor(route.duration / 3600);
                    const mins = Math.round((route.duration % 3600) / 60);

                    // Kontrola omezení podle parametrů vozidla
                    let warnings = [];
                    if (height > 3.9) warnings.push("⚠️ Pozor na výškové limity podjezdů (nad 3.9m).");
                    if (isAdr) warnings.push("⚠️ Trasa může křížit tunely se zákazem ADR (např. Elbtunnel).");

                    routeInfo.innerHTML = `
                        <b>✅ Trasa spočítána:</b> ${distanceKm} km | ⏱️ cca ${hours}h ${mins}min<br>
                        ${warnings.length > 0 ? '<br><span style="color:#f59e0b">' + warnings.join('<br>') + '</span>' : ''}
                    `;
                }
            } catch (e) {
                routeInfo.innerHTML = "❌ Chyba při výpočtu trasy.";
            }
        }

        drawBGLPoints();
    </script>
</body>
</html>
